<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Veículos | Brik Bom</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f3f3;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      color: #FFD400;
      margin: 0;
    }

    .btn-sair {
      background: #e31b23;
      color: white;
      border: 0;
      padding: 10px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .painel {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
      background: #fafafa;
    }

    .btn-salvar {
      width: 100%;
      padding: 15px;
      background: #25D366;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-salvar:hover {
      background: #1ebe5d;
    }

    #mensagem {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚗 Brik Bom</h1>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </header>

  <main>

    <div class="painel">

      <h2>Cadastrar veículo</h2>

      <div class="campo">
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" placeholder="Ex.: Volkswagen Nivus GTS">
      </div>

      <div class="campo">
        <label for="ano">Ano</label>
        <input type="number" id="ano" placeholder="Ex.: 2026">
      </div>

      <div class="campo">
        <label for="km">Quilometragem</label>
        <input type="number" id="km" placeholder="Ex.: 10000">
      </div>

      <div class="campo">
        <label for="cambio">Câmbio</label>
        <select id="cambio">
          <option value="">Selecione</option>
          <option value="Automático">Automático</option>
          <option value="Manual">Manual</option>
          <option value="Automatizado">Automatizado</option>
          <option value="CVT">CVT</option>
        </select>
      </div>

      <div class="campo">
        <label for="preco">Preço</label>
        <input type="number" id="preco" placeholder="Ex.: 167900">
      </div>

      <div class="campo">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" placeholder="Informações do veículo"></textarea>
      </div>

      <div class="campo">
        <label for="whatsapp">WhatsApp para este veículo</label>
        <input type="text" id="whatsapp" value="5545998011079">
      </div>

      <div class="campo">
        <label for="fotos">Fotos do veículo</label>
        <input type="file" id="fotos" accept="image/*" multiple>
      </div>

      <button class="btn-salvar" onclick="salvarVeiculo()">
        💾 Salvar veículo
      </button>

      <div id="mensagem"></div>
     <h2>🚗 Veículos cadastrados</h2>

<div id="lista-veiculos"></div>

    </div>

  </main>

  <script>

    const SUPABASE_URL = "https://rkpkmtmsjmrjoyaxtlkd.supabase.co";
   const SUPABASE_KEY = "sb_publishable_6hbcaoW8PjXW1ExL6mB3MQ_hPho6Mi5";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function verificarLogin() {

      const { data: { session } } =
        await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "admin.html";
      }
    }

    async function sair() {

      await supabaseClient.auth.signOut();

      window.location.href = "admin.html";
    }

    
    async function salvarVeiculo() {

  const mensagem = document.getElementById("mensagem");
  const modelo = document.getElementById("modelo").value.trim();
  const ano = Number(document.getElementById("ano").value);
  const km = Number(document.getElementById("km").value);
  const cambio = document.getElementById("cambio").value;
  const preco = Number(document.getElementById("preco").value);
  const descricao = document.getElementById("descricao").value.trim();
  const whatsapp = document.getElementById("whatsapp").value.trim();
  const arquivos = document.getElementById("fotos").files;

  if (!modelo || !ano || !km || !cambio || !preco || arquivos.length === 0) {
    mensagem.textContent = "❌ Preencha os campos obrigatórios e escolha pelo menos uma foto.";
    return;
  }

  mensagem.textContent = "🟢 CHEGOU AQUI";
const fotos = [];
  for (let i = 0; i < arquivos.length; i++) {
    mensagem.textContent = "📸 Enviando foto " + (i + 1) + " de " + arquivos.length + "...";

    const arquivo = arquivos[i];

    const nomeArquivo =
      Date.now() + "_" +
      Math.random().toString(36).substring(2) + "_" +
      arquivo.name.replace(/\s+/g, "-");

    const caminho = "veiculos/" + nomeArquivo;

    const uploadPromise = supabaseClient.storage
  .from("carros")
  .upload(caminho, arquivo);

const timeoutPromise = new Promise((_, reject) =>
  setTimeout(() => reject(new Error("Tempo limite de 20 segundos atingido no upload.")), 20000)
);

let uploadResult;

try {
  uploadResult = await Promise.race([uploadPromise, timeoutPromise]);
} catch (erroUpload) {
  mensagem.textContent = "❌ O upload ficou travado: " + erroUpload.message;
  console.error("ERRO NO UPLOAD:", erroUpload);
  return;
}

const uploadError = uploadResult.error;

    if (uploadError) {
      mensagem.textContent = "❌ Erro ao enviar a foto: " + uploadError.message;
      return;
    }
    mensagem.textContent = "✅ Foto enviada! Preparando cadastro...";

    const { data: urlData } =
      supabaseClient.storage
        .from("carros")
        .getPublicUrl(caminho);

    fotos.push(urlData.publicUrl);
  }

 mensagem.textContent = "📦 Enviando dados do veículo para o banco...";

const { data: veiculoSalvo, error: erroBanco } =
  await supabaseClient
    .from("veiculos")
      .insert({
      modelo: modelo,
      ano: ano,
      km: km,
      cambio: cambio,
      "preço": preco,
      "descrição": descricao,
      foto_principal: fotos[0],
      fotos: JSON.stringify(fotos),
      whatsapp: whatsapp,
      disponivel: true
    })
    .select();

if (erroBanco) {
  console.error("ERRO SUPABASE:", erroBanco);
  mensagem.textContent = "❌ ERRO NO BANCO: " + erroBanco.message;
  return;
}

console.log("VEÍCULO SALVO:", veiculoSalvo);
mensagem.textContent = "✅ Veículo cadastrado com sucesso!";

  document.getElementById("modelo").value = "";
  document.getElementById("ano").value = "";
  document.getElementById("km").value = "";
  document.getElementById("cambio").value = "";
  document.getElementById("preco").value = "";
  document.getElementById("descricao").value = "";
  document.getElementById("fotos").value = "";

  }
    
    async function carregarVeiculosAdmin() {

  const lista = document.getElementById("lista-veiculos");

  lista.innerHTML = "🔄 Carregando veículos...";

  const { data: veiculos, error } =
    await supabaseClient
      .from("veiculos")
      .select("*")
      .order("id", { ascending: false });

  if (error) {
    console.error("Erro ao carregar veículos:", error);
    lista.innerHTML = "❌ Erro ao carregar veículos.";
    return;
  }

  lista.innerHTML = "";

  veiculos.forEach(veiculo => {

    const item = document.createElement("div");

    item.innerHTML = `
      <strong>${veiculo.modelo}</strong>
      <br>
      ${veiculo.ano} • ${Number(veiculo.km).toLocaleString("pt-BR")} km
      <br><br>
      <button type="button" onclick="excluirVeiculo(${veiculo.id})">
        🗑️ Excluir veículo
      </button>
      <hr>
    `;

    lista.appendChild(item);

  });
}

async function excluirVeiculo(id) {

  const confirmar =
    confirm("Tem certeza que deseja excluir este veículo?");

  if (!confirmar) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("veiculos")
      .delete()
      .eq("id", id);

  if (error) {

    console.error("Erro ao excluir:", error);

    alert("❌ Não foi possível excluir o veículo.");

    return;
  }

  alert("✅ Veículo excluído com sucesso!");

  carregarVeiculosAdmin();
}

verificarLogin();
carregarVeiculosAdmin();

  </script>

</body>
</html>
